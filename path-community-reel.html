<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bristol Community Showcase — Bristol Hearing Loss Initiative">
  <meta charset="UTF-8">
  <title>Community | Bristol Hearing Loss Initiative</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,1,0" />
  <link rel="icon" type="image/png" href="Contents/Pictures/Favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Pure Full-Screen Video Background */
    .video-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #community-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fade Transition Screen: Black on entry, White on exit */
    #fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      opacity: 1;
      pointer-events: none;
      z-index: 100;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 1.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Minimalist Unobtrusive Controls (Top Right) */
    .top-controls {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .glass-btn {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.85);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      opacity: 0.45;
      transition: all 0.3s ease;
    }

    .glass-btn:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.65);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .audio-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      justify-content: center;
      border-radius: 50%;
    }

    /* Subtle bottom progress bar */
    .bottom-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 50;
    }

    .bottom-progress-fill {
      height: 100%;
      width: 0%;
      background: rgba(255, 255, 255, 0.6);
      transition: width 0.1s linear;
    }

    /* Mobile Landscape Auto-Orientation: Rotates to widescreen landscape when held in portrait */
    @media (max-width: 900px) and (orientation: portrait) {
      .video-stage {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Stage -->
  <div class="video-stage">
    <video id="community-video" playsinline webkit-playsinline x5-playsinline preload="auto" poster="Contents/Videos/community-reel-poster.jpg" autoplay>
      <source src="Contents/Videos/community-reel.webm" type="video/webm">
      <source src="Contents/Videos/community-reel.mp4" type="video/mp4">
    </video>

    <!-- Minimalist Controls inside rotated stage -->
    <div class="top-controls">
      <button id="btn-audio-toggle" class="glass-btn audio-btn" aria-label="Mute or Unmute Audio" title="Toggle Sound">
        <span id="audio-icon" class="material-symbols-outlined" style="font-size: 1.25rem;">volume_up</span>
      </button>
      <button id="btn-skip" class="glass-btn" aria-label="Skip to Journey Hub">
        Skip &rarr;
      </button>
    </div>

    <!-- Subtle Minimal Bottom Progress Line inside rotated stage -->
    <div class="bottom-progress">
      <div id="progress-fill" class="bottom-progress-fill"></div>
    </div>
  </div>

  <!-- Fade Overlay: In from Black -> Out into White -->
  <div id="fade-overlay"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById("community-video");
      const overlay = document.getElementById("fade-overlay");
      const skipBtn = document.getElementById("btn-skip");
      const audioBtn = document.getElementById("btn-audio-toggle");
      const audioIcon = document.getElementById("audio-icon");
      const progressFill = document.getElementById("progress-fill");

      let isTransitioningOut = false;

      // 1. Smooth Fade In From Black on Start
      function startFadeIn() {
        if (overlay) {
          overlay.style.backgroundColor = "#000000";
          overlay.style.opacity = "1";
          requestAnimationFrame(() => {
            overlay.style.opacity = "0";
          });
        }
      }

      // 2. Smooth Fade Out Into White and Navigate to path-yes.html
      function transitionToWhite(isManual = false) {
        if (isTransitioningOut) return;
        isTransitioningOut = true;

        if (overlay) {
          overlay.style.transition = "opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease";
          overlay.style.backgroundColor = "#ffffff";
          overlay.style.opacity = "1";
        }

        // If skipped manually while playing, smoothly fade down audio
        if (isManual && video && !video.paused) {
          const fadeAudio = setInterval(() => {
            if (video.volume > 0.08) {
              video.volume -= 0.08;
            } else {
              video.volume = 0;
              clearInterval(fadeAudio);
            }
          }, 40);
        }

        setTimeout(() => {
          localStorage.setItem("hasVisitedCommunityReel", "true");
          window.location.href = "path-yes.html";
        }, 1200);
      }

      // Attempt Screen Orientation lock to landscape on supported mobile devices
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {
            // Smoothly falls back to CSS 90deg orientation rotation
          });
        }
      } catch (err) {}

      if (video) {
        video.loop = false;

        // Attempt immediate playback
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            startFadeIn();
          }).catch(() => {
            // Autoplay blocked: mute and play, update icon
            video.muted = true;
            if (audioIcon) audioIcon.textContent = "volume_off";
            video.play().then(() => {
              startFadeIn();
            });
          });
        }

        // Progress bar tracking & auto-trigger fade to white at completion
        video.addEventListener("timeupdate", () => {
          const cur = video.currentTime;
          const dur = video.duration || 10.0;
          const pct = Math.min(100, (cur / dur) * 100);
          if (progressFill) progressFill.style.width = pct + "%";

          // If reached the end of the video, pause and fade to white
          if (dur > 0 && cur >= (dur - 0.1) && !isTransitioningOut) {
            video.pause();
            transitionToWhite(false);
          }
        });

        // Trigger fade out into white when video ends
        video.addEventListener("ended", () => {
          if (!isTransitioningOut) {
            transitionToWhite(false);
          }
        });

        // Audio Mute/Unmute Toggle
        if (audioBtn) {
          audioBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            video.muted = !video.muted;
            if (video.muted) {
              if (audioIcon) audioIcon.textContent = "volume_off";
            } else {
              if (audioIcon) audioIcon.textContent = "volume_up";
              video.volume = 1.0;
            }
          });
        }
      }

      // Skip Button
      if (skipBtn) {
        skipBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          transitionToWhite(true);
        });
      }

      // Allow tap/click anywhere to skip
      document.body.addEventListener("click", (e) => {
        if (!e.target.closest("#btn-audio-toggle")) {
          transitionToWhite(true);
        }
      });

      // Keyboard support: Escape or Space to skip/continue
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "Enter" || e.key === " ") {
          transitionToWhite(true);
        }
      });
    });
  </script>
</body>
</html>
