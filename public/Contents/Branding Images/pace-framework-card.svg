<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background: #ffffff; border-radius: 20px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="1000" height="680" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Banner Header -->
  <rect x="0" y="0" width="1000" height="130" rx="20" fill="url(#headerGrad)" />
  <rect x="0" y="110" width="1000" height="20" fill="#1e293b" />
  
  <text x="50" y="52" fill="#38bdf8" font-size="14" font-weight="800" letter-spacing="1.5">BRISTOL HEARING LOSS INITIATIVE • COMMUNITY TOOLKIT</text>
  <text x="50" y="94" fill="#ffffff" font-size="32" font-weight="900" letter-spacing="-0.5">The PACE Communication Framework</text>
  <text x="50" y="118" fill="#94a3b8" font-size="15" font-weight="500">Four essential principles for clear, inclusive conversations</text>

  <!-- 4 Framework Cards (2x2 Grid) -->
  
  <!-- CARD P: PATIENCE -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="445" height="225" rx="16" fill="url(#pGrad)" stroke="#fde68a" stroke-width="2" />
    <rect x="0" y="0" width="8" height="225" rx="4" fill="#d97706" />
    <!-- Icon Circle -->
    <circle cx="55" cy="55" r="28" fill="#d97706" />
    <text x="55" y="65" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle">P</text>
    <!-- Card Title -->
    <text x="100" y="48" fill="#92400e" font-size="12" font-weight="800" letter-spacing="1">STEP 1</text>
    <text x="100" y="74" fill="#78350f" font-size="24" font-weight="900">Patience</text>
    <!-- Card Bullet Points -->
    <text x="35" y="118" fill="#92400e" font-size="18" font-weight="900">•</text>
    <text x="55" y="117" fill="#451a03" font-size="15" font-weight="600">Give extra time for speech processing</text>
    <text x="35" y="152" fill="#92400e" font-size="18" font-weight="900">•</text>
    <text x="55" y="151" fill="#451a03" font-size="15" font-weight="600">Rephrase sentences instead of repeating louder</text>
    <text x="35" y="186" fill="#92400e" font-size="18" font-weight="900">•</text>
    <text x="55" y="185" fill="#451a03" font-size="15" font-weight="600">Stay supportive with zero frustration</text>
  </g>

  <!-- CARD A: ATTENTION -->
  <g transform="translate(515, 160)" filter="url(#shadow)">
    <rect width="445" height="225" rx="16" fill="url(#aGrad)" stroke="#bfdbfe" stroke-width="2" />
    <rect x="0" y="0" width="8" height="225" rx="4" fill="#2563eb" />
    <!-- Icon Circle -->
    <circle cx="55" cy="55" r="28" fill="#2563eb" />
    <text x="55" y="65" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle">A</text>
    <!-- Card Title -->
    <text x="100" y="48" fill="#1e40af" font-size="12" font-weight="800" letter-spacing="1">STEP 2</text>
    <text x="100" y="74" fill="#1e3a8a" font-size="24" font-weight="900">Attention</text>
    <!-- Card Bullet Points -->
    <text x="35" y="118" fill="#1e40af" font-size="18" font-weight="900">•</text>
    <text x="55" y="117" fill="#172554" font-size="15" font-weight="600">Check surroundings and reduce background noise</text>
    <text x="35" y="152" fill="#1e40af" font-size="18" font-weight="900">•</text>
    <text x="55" y="151" fill="#172554" font-size="15" font-weight="600">Confirm key points gently and discreetly</text>
    <text x="35" y="186" fill="#1e40af" font-size="18" font-weight="900">•</text>
    <text x="55" y="185" fill="#172554" font-size="15" font-weight="600">Use written notes or live captions as backup</text>
  </g>

  <!-- CARD C: CLARITY -->
  <g transform="translate(40, 410)" filter="url(#shadow)">
    <rect width="445" height="225" rx="16" fill="url(#cGrad)" stroke="#bbf7d0" stroke-width="2" />
    <rect x="0" y="0" width="8" height="225" rx="4" fill="#16a34a" />
    <!-- Icon Circle -->
    <circle cx="55" cy="55" r="28" fill="#16a34a" />
    <text x="55" y="65" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle">C</text>
    <!-- Card Title -->
    <text x="100" y="48" fill="#166534" font-size="12" font-weight="800" letter-spacing="1">STEP 3</text>
    <text x="100" y="74" fill="#14532d" font-size="24" font-weight="900">Clarity</text>
    <!-- Card Bullet Points -->
    <text x="35" y="118" fill="#166534" font-size="18" font-weight="900">•</text>
    <text x="55" y="117" fill="#052e16" font-size="15" font-weight="600">Speak clearly at a steady, natural pace</text>
    <text x="35" y="152" fill="#166534" font-size="18" font-weight="900">•</text>
    <text x="55" y="151" fill="#052e16" font-size="15" font-weight="600">Never shout (shouting distorts lip patterns)</text>
    <text x="35" y="186" fill="#166534" font-size="18" font-weight="900">•</text>
    <text x="55" y="185" fill="#052e16" font-size="15" font-weight="600">Keep phrasing concise with plain language</text>
  </g>

  <!-- CARD E: EYE CONTACT -->
  <g transform="translate(515, 410)" filter="url(#shadow)">
    <rect width="445" height="225" rx="16" fill="url(#eGrad)" stroke="#e9d5ff" stroke-width="2" />
    <rect x="0" y="0" width="8" height="225" rx="4" fill="#9333ea" />
    <!-- Icon Circle -->
    <circle cx="55" cy="55" r="28" fill="#9333ea" />
    <text x="55" y="65" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle">E</text>
    <!-- Card Title -->
    <text x="100" y="48" fill="#6b21a8" font-size="12" font-weight="800" letter-spacing="1">STEP 4</text>
    <text x="100" y="74" fill="#581c87" font-size="24" font-weight="900">Eye Contact</text>
    <!-- Card Bullet Points -->
    <text x="35" y="118" fill="#6b21a8" font-size="18" font-weight="900">•</text>
    <text x="55" y="117" fill="#3b0764" font-size="15" font-weight="600">Face the person directly to aid lipreading</text>
    <text x="35" y="152" fill="#6b21a8" font-size="18" font-weight="900">•</text>
    <text x="55" y="151" fill="#3b0764" font-size="15" font-weight="600">Keep hands and items away from your mouth</text>
    <text x="35" y="186" fill="#6b21a8" font-size="18" font-weight="900">•</text>
    <text x="55" y="185" fill="#3b0764" font-size="15" font-weight="600">Stay in good lighting so your face is clear</text>
  </g>

  <!-- Bottom Footer Note -->
  <text x="500" y="655" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">© 2026 Bristol Hearing Loss Initiative • Free Community Awareness Resource • hearinglossinitiative.org.uk</text>
</svg>
