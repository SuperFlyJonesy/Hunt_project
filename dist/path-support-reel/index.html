<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hearing Expo | Bristol Hearing Loss Initiative</title><meta name="description" content="Hearing Expo — Bristol Hearing Loss Initiative Support Pathway"><meta name="theme-color" content="#005EB8"><link rel="icon" type="image/png" href="/Contents/Branding Images/favicon.png"><link rel="apple-touch-icon" href="/Contents/Pictures/Favicon.png"><link rel="manifest" href="/manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,1,0"><link rel="stylesheet" href="/styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{-webkit-user-select:none;user-select:none;cursor:pointer;background:#000;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}.video-stage{justify-content:center;align-items:center;width:100vw;height:100vh;display:flex;position:absolute;top:0;left:0;overflow:hidden}#expo-video{object-fit:cover;width:100%;height:100%;display:block}#fade-overlay{opacity:1;pointer-events:none;z-index:100;background:#000;width:100vw;height:100vh;transition:opacity 1.2s cubic-bezier(.4,0,.2,1),background-color .4s;position:fixed;top:0;left:0}.top-controls{z-index:50;align-items:center;gap:12px;display:flex;position:absolute;top:24px;right:28px}.glass-btn{backdrop-filter:blur(10px);color:#ffffffd9;cursor:pointer;opacity:.45;background:#00000059;border:1px solid #fff3;border-radius:30px;align-items:center;gap:6px;padding:10px 18px;font-size:.9rem;font-weight:600;text-decoration:none;transition:all .3s;display:inline-flex}.glass-btn:hover{opacity:1;background:#000000a6;border-color:#ffffff80;transform:translateY(-1px)}.audio-btn{border-radius:50%;justify-content:center;width:42px;height:42px;padding:0}@keyframes pulsePrompt{0%,to{opacity:.35;transform:translate(-50%)scale(1)}50%{opacity:.95;transform:translate(-50%)scale(1.03)}}@keyframes pulsePromptEnd{0%,to{opacity:.85;transform:translate(-50%)scale(1);box-shadow:0 0 20px #00a4ef66,0 4px 20px #0009}50%{opacity:1;transform:translate(-50%)scale(1.06);box-shadow:0 0 35px #00a4efcc,0 4px 30px #000c}}.click-continue-prompt{z-index:50;color:#fff;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 12px #000000e6;pointer-events:none;white-space:nowrap;font-size:13px;font-weight:700;transition:all .5s cubic-bezier(.16,1,.3,1);animation:2.5s ease-in-out infinite pulsePrompt;position:absolute;bottom:36px;left:50%;transform:translate(-50%)}.click-continue-prompt.active-end{backdrop-filter:blur(12px);pointer-events:auto;cursor:pointer;background:#000000b3;border:1.5px solid #fff9;border-radius:35px;padding:14px 28px;font-size:14px;animation:1.8s ease-in-out infinite pulsePromptEnd}.bottom-progress{z-index:50;background:#ffffff1a;width:100%;height:3px;position:absolute;bottom:0;left:0}.bottom-progress-fill{background:#fff9;width:0%;height:100%;transition:width .1s linear}@media (width<=900px) and (orientation:portrait){.video-stage{transform-origin:50%;width:100vh;height:100vw;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)rotate(90deg)}}
</style></head><body class="premium-white-theme"><a class="skip-link" href="#main-content">Skip to main content</a><a href="#main-content" class="skip-link" style="position: absolute; top: -100px; left: 15px; background: #ff0f5b; color: #ffffff; padding: 10px 20px; border-radius: 8px; font-weight: 800; z-index: 99999999; text-decoration: none; transition: top 0.2s ease;">Skip to Video Stage</a><main id="main-content"><!-- Fullscreen Video Stage --><div class="video-stage"><video id="expo-video" playsinline webkit-playsinline x5-playsinline preload="auto" poster="/Contents/Videos/expo-reel-poster.jpg" autoplay><source src="/Contents/Videos/expo-reel.webm" type="video/webm"><source src="/Contents/Videos/expo-reel.mp4" type="video/mp4"></video><!-- Minimalist Controls inside rotated stage --><div class="top-controls"><button id="btn-audio-toggle" class="glass-btn audio-btn" aria-label="Mute or Unmute Audio" title="Toggle Sound"><span id="audio-icon" class="material-symbols-outlined" style="font-size: 1.25rem;">volume_up</span></button><button id="btn-skip" class="glass-btn" aria-label="Skip to Support Hub">Skip &rarr;</button></div><!-- Click to Continue Prompt inside rotated stage --><div class="click-continue-prompt">[ Click anywhere to continue ]</div><!-- Subtle Minimal Bottom Progress Line inside rotated stage --><div class="bottom-progress"><div id="progress-fill" class="bottom-progress-fill"></div></div></div><!-- Fade Overlay: In from Black -> Out into White --><div id="fade-overlay"></div><script>
      document.addEventListener("DOMContentLoaded", () => {
        const video = document.getElementById("expo-video");
        const overlay = document.getElementById("fade-overlay");
        const skipBtn = document.getElementById("btn-skip");
        const audioBtn = document.getElementById("btn-audio-toggle");
        const audioIcon = document.getElementById("audio-icon");
        const progressFill = document.getElementById("progress-fill");
  
        let isTransitioningOut = false;
  
        // 1. Smooth Fade In From Black on Start
        function startFadeIn() {
          if (overlay) {
            overlay.style.backgroundColor = "#000000";
            overlay.style.opacity = "1";
            requestAnimationFrame(() => {
              overlay.style.opacity = "0";
            });
          }
        }
  
        // 2. Smooth Fade Out Into White and Navigate to path-support.html
        function transitionToWhite(isManual = false) {
          if (isTransitioningOut) return;
          isTransitioningOut = true;
  
          if (overlay) {
            overlay.style.transition = "opacity 1.0s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease";
            overlay.style.backgroundColor = "#ffffff";
            overlay.style.opacity = "1";
          }
  
          // If skipped manually while playing, smoothly fade down audio
          if (isManual && video && !video.paused) {
            const fadeAudio = setInterval(() => {
              if (video.volume > 0.08) {
                video.volume -= 0.08;
              } else {
                video.volume = 0;
                clearInterval(fadeAudio);
              }
            }, 40);
          }
  
          setTimeout(() => {
            localStorage.setItem("hasVisitedSupportReel", "true");
            window.location.href='/path-support';
          }, 1000);
        }
  
        // Attempt Screen Orientation lock to landscape on supported mobile devices
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        } catch (err) {}
  
        if (video) {
          video.loop = false;
  
          // Attempt immediate playback
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              startFadeIn();
            }).catch(() => {
              // Autoplay blocked: mute and play, update icon
              video.muted = true;
              if (audioIcon) audioIcon.textContent = "volume_off";
              video.play().then(() => {
                startFadeIn();
              });
            });
          }
  
          function showEndClickPrompt() {
            const prompt = document.querySelector('.click-continue-prompt');
            if (prompt) {
              prompt.classList.add('active-end');
              prompt.textContent = "[ Click to continue ]";
            }
          }
  
          // Progress bar tracking & trigger click prompt at completion
          video.addEventListener("timeupdate", () => {
            const cur = video.currentTime;
            const dur = video.duration || 10.0;
            const pct = Math.min(100, (cur / dur) * 100);
            if (progressFill) progressFill.style.width = pct + "%";
  
            // If reached the end of the video, pause and prompt click
            if (dur > 0 && cur >= (dur - 0.08)) {
              video.pause();
              showEndClickPrompt();
            }
          });
  
          // Trigger prompt when video ends
          video.addEventListener("ended", () => {
            showEndClickPrompt();
          });
  
          // Audio Mute/Unmute Toggle
          if (audioBtn) {
            audioBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              video.muted = !video.muted;
              if (video.muted) {
                if (audioIcon) audioIcon.textContent = "volume_off";
              } else {
                if (audioIcon) audioIcon.textContent = "volume_up";
                video.volume = 1.0;
              }
            });
          }
        }
  
        // Skip Button
        if (skipBtn) {
          skipBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            transitionToWhite(true);
          });
        }
  
        // Click anywhere to continue
        document.body.addEventListener("click", (e) => {
          if (!e.target.closest("#btn-audio-toggle")) {
            transitionToWhite(true);
          }
        });
  
        // Keyboard support: Escape, Space, or Enter to continue
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" || e.key === "Enter" || e.key === " ") {
            transitionToWhite(true);
          }
        });
      });
    </script></main><script src="/script.js" defer></script></body></html>
