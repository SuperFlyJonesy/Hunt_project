<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore an interactive map of community-reported accessible venues across Bristol featuring Induction Loops, Auracast, and acoustic ratings.">
  <title>Bristol Venue Accessibility Map - Hearing Loss Initiative</title>

  <!-- Performance Preconnects -->
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,1,0" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles/venue-map.css?v=13" />
  <link rel="icon" type="image/png" href="Contents/Pictures/Favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#005EB8">
    <link rel="apple-touch-icon" href="Contents/Pictures/Favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bristol Hearing Loss Initiative">
    <meta property="og:title" content="Bristol Venue Accessibility Map - Hearing Loss Initiative">
    <meta property="og:description" content="Explore an interactive map of community-reported accessible venues across Bristol featuring Induction Loops, Auracast, and acoustic ratings.">
    <meta property="og:image" content="https://hearinglossinitiative.org.uk/Contents/Branding%20Images/HLI%20logo%20Black.png">
    <meta property="og:url" content="https://hearinglossinitiative.org.uk/venue-map.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bristol Venue Accessibility Map - Hearing Loss Initiative">
    <meta name="twitter:description" content="Explore an interactive map of community-reported accessible venues across Bristol featuring Induction Loops, Auracast, and acoustic ratings.">
    <meta name="twitter:image" content="https://hearinglossinitiative.org.uk/Contents/Branding%20Images/HLI%20logo%20Black.png">
</head>
<body>
  <a href="#map-view" class="skip-link" style="position: absolute; top: -100px; left: 15px; background: #ff0f5b; color: #ffffff; padding: 10px 20px; border-radius: 8px; font-weight: 800; z-index: 99999999; text-decoration: none; transition: top 0.2s ease;">Skip to Map</a>
  <header class="map-header">
    <div class="header-left">
      <h1><span class="material-symbols-outlined" style="vertical-align: middle; font-size: 1.25rem; margin-right: 4px;">map</span> Greater Bristol Map</h1>
      <a href="path-accessible-venues.html" class="compact-btn">← Venue Directory</a>
      <a href="path-join-us.html" class="compact-btn patreon">🔒 Add a Venue (Patreon Only - Coming Soon)</a>
      
      <!-- Postcode Select -->
      <select id="filter-postcode" class="postcode-select" aria-label="Filter by Bristol Postcode District">
        <option value="ALL">📍 Highlight All Postcodes</option>
        <option value="NONE">🚫 No Postcodes (Hide)</option>
        <option value="BS1">BS1 - City Centre</option>
        <option value="BS2">BS2 - St Pauls & Old Market</option>
        <option value="BS3">BS3 - Southville & Bedminster</option>
        <option value="BS4">BS4 - Knowle & Brislington</option>
        <option value="BS5">BS5 - Easton & St George</option>
        <option value="BS6">BS6 - Redland & Cotham</option>
        <option value="BS7">BS7 - Bishopston & Horfield</option>
        <option value="BS8">BS8 - Clifton & Hotwells</option>
        <option value="BS9">BS9 - Westbury-on-Trym</option>
        <option value="BS10">BS10 - Southmead & Henbury</option>
        <option value="BS11">BS11 - Shirehampton & Avonmouth</option>
        <option value="BS13">BS13 - Hartcliffe & Withywood</option>
        <option value="BS14">BS14 - Stockwood & Hengrove</option>
        <option value="BS15">BS15 - Hanham & Kingswood</option>
        <option value="BS16">BS16 - Fishponds & Vassall</option>
        <option value="BS20">BS20 - Portishead & Pill</option>
        <option value="BS30">BS30 - Bitton & Longwell Green</option>
        <option value="BS31">BS31 - Keynsham & Saltford</option>
        <option value="BS32">BS32 - Bradley Stoke</option>
        <option value="BS34">BS34 - Filton & Patchway</option>
        <option value="BS35">BS35 - Thornbury & Severnside</option>
        <option value="BS41">BS41 - Long Ashton</option>
        <option value="BS48">BS48 - Airport & Nailsea</option>
      </select>
    </div>

    <!-- Feature Checkboxes -->
    <div class="filters">
      <label>
        <input type="checkbox" id="filter-induction" checked />
        <span class="dot induction"></span>
        Loop
      </label>

      <label>
        <input type="checkbox" id="filter-auracast" checked />
        <span class="dot auracast"></span>
        Auracast
      </label>

      <label>
        <input type="checkbox" id="filter-quiet" checked />
        <span class="dot quiet"></span>
        Quiet Zone
      </label>
    </div>
  </header>

  <!-- Interactive Floating Venue List Sidebar Panel -->
  <button id="toggle-sidebar-btn" class="venue-sidebar-toggle">
    <span class="material-symbols-outlined">list</span> 📋 Community Venues List
  </button>

  <aside id="venue-sidebar" class="venue-sidebar collapsed">
    <div class="sidebar-header">
      <h2>📋 Community Venues (Unverified)</h2>
      <button id="close-sidebar-btn" style="background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer;">&times;</button>
    </div>
    <div class="sidebar-search">
      <input type="search" id="sidebar-search-input" name="hli_venue_map_search" placeholder="🔍 Search venue, postcode, or feature..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" />
    </div>
    <div id="sidebar-venue-list" class="sidebar-list"></div>
  </aside>

  <main id="map" style="position: relative; height: calc(100vh - 52px); width: 100%;">
    <div id="map-loader" class="map-loader">
      <div class="map-loader-spinner"></div>
      <div class="map-loader-text">Loading Greater Bristol Map...</div>
    </div>
  </main>

  <!-- Map logic loaded before API callback -->
  <script src="js/venue-map.js?v=46"></script>

  <!-- Google Maps JS API loader -->
  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBR126ydv-9UusD-VAHZI9QVwfmugu-rGQ&callback=initMap">
  </script>
</body>
</html>
