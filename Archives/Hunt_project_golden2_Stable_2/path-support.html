<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offer Support</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,1,0" />
</head>
<body class="premium-white-theme">
    <button id="dev-reset" style="position: fixed; top: 15px; left: 15px; background: #ff0f5b; border: 2px solid white; color: white; font-weight: bold; padding: 10px 15px; border-radius: 8px; cursor: pointer; z-index: 99999999; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">🛠️ RESET JOURNEY</button>
    
    <!-- SUPPORT US BUTTON - FIXED TOP RIGHT -->
    <a href="path-about.html" id="btn-support" class="nav-btn-small" style="position: fixed; top: 15px; right: 15px; z-index: 9999999; background: #ff0f5b; color: white; padding: 12px 24px; text-decoration: none; font-weight: 800; border-radius: 10px; font-size: 0.95rem; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255,15,91,0.3); transition: transform 0.2s;">Support Us</a>
    
    <header class="top-nav" style="padding: 2rem; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <img src="HLI logo 1.png" alt="HLI Logo" style="height: 55px; filter: contrast(1.1); margin-bottom: 20px;">
        <h1 style="color: #222; font-size: 2.2rem; font-weight: 900; margin: 0; letter-spacing: -1px;">Support the Community</h1>
        <p style="color: #666; font-size: 1.1rem; max-width: 600px; text-align: center; margin-top: 10px;">Resources for friends, families, and businesses wanting to empower the HoH community.</p>
    </header>
    
    <div class="metro-grid">
        <a class="metro-btn" style="background-color: #D32F2F;"><span class="material-symbols-outlined metro-icon">family_restroom</span><span class="metro-text">Family Guide</span></a>
        <a class="metro-btn" style="background-color: #1976D2;"><span class="material-symbols-outlined metro-icon">work</span><span class="metro-text">Workplace Tips</span></a>
        <a class="metro-btn" style="background-color: #388E3C;"><span class="material-symbols-outlined metro-icon">volunteer_activism</span><span class="metro-text">Volunteer</span></a>
        <a class="metro-btn" style="background-color: #F57C00;"><span class="material-symbols-outlined metro-icon">campaign</span><span class="metro-text">Awareness</span></a>
        <a class="metro-btn" style="background-color: #7B1FA2;"><span class="material-symbols-outlined metro-icon">group_add</span><span class="metro-text">Join Outreach</span></a>
        <a class="metro-btn" style="background-color: #0097A7;"><span class="material-symbols-outlined metro-icon">corporate_fare</span><span class="metro-text">Sponsor Us</span></a>
        <a class="metro-btn" style="background-color: #C2185B;"><span class="material-symbols-outlined metro-icon">school</span><span class="metro-text">Training</span></a>
        <a class="metro-btn" style="background-color: #455A64;"><span class="material-symbols-outlined metro-icon">arrow_back</span><span class="metro-text">Back Home</span></a>
    </div>
    
    <div class="page-transition-overlay"></div>
    <script src="script.js"></script>
    <script>
        // Special routing for the back button in the grid
        document.querySelector('.metro-btn[style*="455A64"]').addEventListener('click', (e) => {
            e.preventDefault();
            const overlay = document.querySelector('.page-transition-overlay');
            if (overlay) overlay.classList.remove('reveal');
            setTimeout(() => { window.location.href = 'index.html'; }, 800);
        });
    </script>
</body>
</html>
